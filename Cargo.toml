[package]
name = "of-zed-project-generator-rs"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/ffunatsu/of-zed-project-generator-rs"
description = "openFrameworks Zed Project Generator (for static analysis only)"
license = "WTFPL OR 0BSD"

[dependencies]
argparse = "0.2.2"
env_logger = "0.11.10"
log = "0.4.29"
once_cell = "1.21.4"
serde = { version = "1.0.149", features = ["derive"] }
serde_json = "1.0.149"

